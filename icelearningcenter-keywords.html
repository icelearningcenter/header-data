<h1 class="video-nav-header">ICE Video Keywords</h1>
<input type="text" id="keywordSearchInput" onkeyup="filterKeywords()" placeholder="Search for keywords...">
<script>
function filterKeywords() {
  let input = document.getElementById('keywordSearchInput');
  let filter = input.value.toLowerCase();
  let groups = document.getElementsByClassName('keyword-group');
  let items = document.getElementsByClassName('keyword-item');
  for (let i = 0; i < items.length; i++) {
    let a = items[i].getElementsByTagName('a')[0];
    let txt = a.textContent || a.innerText;
    items[i].style.display = txt.toLowerCase().indexOf(filter) > -1 ? "" : "none";
  }
  for (let i = 0; i < groups.length; i++) {
    let visible = Array.from(groups[i].getElementsByClassName('keyword-item'))
                       .some(el => el.style.display !== "none");
    groups[i].style.display = visible ? "" : "none";
  }
}
</script>

<div class="jump-nav"></div>
<hr>

<div id="keyword-list-wrapper">
</div>
